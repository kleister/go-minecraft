---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3.40"

vars:
  SOURCES:
    sh: find . -name "*.go" -type f | xargs echo
  PACKAGES:
    sh: go list ./... | xargs echo

tasks:
  clean:
    desc: Remove all temporary artifacts
    cmds:
      - go clean -i ./...

  fmt:
    desc: Run standard formatter
    vars:
      SOURCES:
        sh: find . -name "*.go" -type f | xargs echo
    cmds:
      - gofmt -s -w {{ .SOURCES }}

  vet:
    desc: Run vet linting
    vars:
      PACKAGES:
        sh: go list ./... | xargs echo
    cmds:
      - go vet {{ .PACKAGES }}

  lint:
    desc: Run revive linting
    vars:
      PACKAGES:
        sh: go list ./... | xargs echo
    cmds:
      - for PKG in {{ .PACKAGES }}; do go tool github.com/mgechev/revive -config revive.toml -set_exit_status $PKG || exit 1; done;

  golangci:
    desc: Run golangci linter
    cmds:
      - go tool github.com/golangci/golangci-lint/v2/cmd/golangci-lint run ./...

  generate:
    desc: Generate code
    vars:
      PACKAGES:
        sh: go list ./... | xargs echo
    cmds:
      - go generate {{ .PACKAGES }}

  test:
    desc: Run tests
    vars:
      PACKAGES:
        sh: go list ./... | xargs echo
    cmds:
      - go test -coverprofile coverage.out {{ .PACKAGES }}

  build:
    desc: Build artifacts
    cmds:
      - go build -v
          -tags 'netgo'
          -ldflags '-s -w -extldflags "-static"'
          -o /dev/null
          ./...
    env:
      CGO_ENABLED: "0"

...
